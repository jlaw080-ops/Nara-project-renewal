{% extends "base.html" %}
{% block title %}비밀번호 바꾸기{% endblock %}
{% block body %}
<section class="panel panel--auth" aria-labelledby="password-title">
  <h1 id="password-title">비밀번호 바꾸기</h1>
  {% if g.user and g.user.must_change %}<div class="notice notice--warning"><span class="notice__title">임시 비밀번호</span><span>임시 비밀번호로 들어왔습니다. 새 비밀번호를 정하세요.</span></div>{% endif %}
  {% if error %}<div class="notice notice--danger" role="alert"><span class="notice__title">오류</span><span>{{ error }}</span></div>{% endif %}
  <form method="post" class="auth-form" action="{{ url_for('change_password') }}">
    <label class="field"><span class="field__label">지금 비밀번호</span><input class="input" type="password" name="current" autocomplete="current-password"></label>
    <label class="field"><span class="field__label">새 비밀번호</span><input class="input" type="password" name="new" autocomplete="new-password"><span class="field__help">10자 이상</span></label>
    <label class="field"><span class="field__label">새 비밀번호 확인</span><input class="input" type="password" name="confirm" autocomplete="new-password"></label>
    <button type="submit" class="btn btn--block">바꾸기</button>
  </form>
</section>
{% endblock %}
