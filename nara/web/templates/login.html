{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block body %}
<section class="panel panel--auth" aria-labelledby="login-title">
  <h1 id="login-title">로그인</h1>
  {% if error %}<div class="notice notice--danger" role="alert"><span class="notice__title">오류</span><span>{{ error }}</span></div>{% endif %}
  <form method="post" class="auth-form" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span class="field__label">이메일</span><input class="input" type="text" name="email" value="{{ email }}" autocomplete="username" inputmode="email"></label>
    <label class="field"><span class="field__label">비밀번호</span><input class="input" type="password" name="password" autocomplete="current-password"></label>
    <button type="submit" class="btn btn--block">로그인</button>
  </form>
  <p class="muted">계정이 없거나 비밀번호를 잊었으면 관리자에게 요청하세요.</p>
</section>
{% endblock %}
