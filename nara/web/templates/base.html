<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}사업 조회{% endblock %} · 나라</title>
<style>
  :root {
    --fg: #1a1a1a; --muted: #666; --line: #ddd; --bad: #b00020;
    --bg: #fff; --head: #f5f5f5; --link: #0b57d0; --link-strong: #0842a0;
    --field-line: #8a8a8a;
  }
  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: var(--fg); background: var(--bg); margin: 16px; font-size: 14px;
  }
  html, body { overflow-x: clip; }
  h1, h2 { overflow-wrap: anywhere; min-width: 0; }
  a { color: var(--link); }
  a:hover { color: var(--link-strong); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--link); outline-offset: 2px;
  }
  input[type=search], input[type=date], button {
    font: inherit; min-height: 44px; box-sizing: border-box; border: 1px solid var(--field-line);
    padding: 0 12px; background: var(--bg); color: var(--fg);
  }
  select { font: inherit; border: 1px solid var(--field-line); }
  button { background: var(--link); border-color: var(--link); color: var(--bg); cursor: pointer; }
  button:hover { background: var(--link-strong); border-color: var(--link-strong); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
  /* 표가 좁은 화면을 넘으면 페이지 전체가 아니라 표 상자만 옆으로 민다. */
  .table-wrap { overflow-x: auto; }
  .edit-link { font-size: 12px; font-weight: normal; margin-left: 8px; }
  .edit-form { display: flex; flex-direction: column; gap: 12px; max-width: 40rem; }
  .edit-form label { display: flex; flex-direction: column; gap: 4px; }
  .edit-form textarea { font: inherit; border: 1px solid var(--field-line); padding: 8px; }
  .edit-form fieldset { border: 1px solid var(--line); padding: 8px 12px; }
  .edit-form .choice { flex-direction: row; align-items: baseline; gap: 8px; }
  .energy-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .field-error { color: var(--bad); font-size: 12px; }
  .saved { border-left: 4px solid var(--link); padding: 8px 12px; background: var(--head); }
  form.inline { display: inline; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
  th { background: var(--head); white-space: nowrap; }
  td { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); font-size: 12px; }
  .bad { color: var(--bad); font-weight: bold; }
  .notes li { color: var(--bad); }
  .runs { margin: 0 0 12px; }
  form.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin: 12px 0; }
  form.filters label { display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
