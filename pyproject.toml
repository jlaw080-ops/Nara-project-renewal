[project]
name = "nara"
version = "0.1.0"
description = "나라장터 설계용역 공고 수집·조사 도구"
requires-python = ">=3.14"
dependencies = [
    "typer",
    "httpx",
    "anthropic>=1.6.0",
    "flask>=3.1.3",
    "waitress>=3.0.2",
    "pypdf>=6.19.0",
    "olefile>=0.47",
]

[project.scripts]
nara = "nara.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# 평면 배치. 기본값은 "src"라 이 줄이 없으면 nara 패키지를 찾지 못한다.
module-root = ""

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
# 계획 문서의 코드 조각을 ruff가 고쳐 쓰면 뜻이 바뀐다(2단계 Task 7에서 실제로 깨졌다).
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
