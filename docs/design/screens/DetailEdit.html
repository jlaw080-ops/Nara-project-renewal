<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DetailEdit · Nara 시안</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../nara.css"></head>
<body>
<main class="page" style="max-width:880px">
<div class="notice notice--success"><span class="notice__title">저장됨</span><span>바꾼 칸: 비고</span></div>
<section class="panel panel--flush panel--editing" aria-label="실행부서 고치기">
  <div class="section-head"><h2>실행부서 고치기</h2><span class="muted">후보를 고르거나 직접 적으세요</span></div>
  <div class="section-body" style="display:flex;flex-direction:column;gap:20px">
    <div><p class="group-title">후보에서 고르기</p>
      <div class="candidates">
        <label class="candidate"><input type="radio" name="pick" checked><span class="candidate__name">시설과</span>
          <span class="candidate__quote">“사업 담당부서: 시설과(학교시설팀)”</span><span class="candidate__meta">과업지시서.pdf · 부서장 063-000-1111</span></label>
        <label class="candidate"><input type="radio" name="pick"><span class="candidate__name">재무과</span>
          <span class="candidate__quote">“계약 관련 문의: 재무과 계약팀”</span><span class="candidate__meta">공고문.hwp · 계약부서일 가능성 높음</span></label>
      </div></div>
    <div class="form-grid">
      <label class="field"><span class="field__label">실행부서 (직접 입력)</span><input class="input" placeholder="후보에 없으면 적으세요"><span class="field__help">후보를 고르면 후보 값을 씁니다.</span></label>
      <label class="field wide"><span class="field__label">근거 문장</span><textarea class="input" rows="2">사업 담당부서: 시설과(학교시설팀)</textarea></label>
    </div>
    <div><p class="group-title">부서장</p><div class="form-grid">
      <label class="field"><span class="field__label">이름</span><input class="input" value="이○○"></label>
      <label class="field"><span class="field__label">직위</span><input class="input" value="시설과장"></label>
      <label class="field"><span class="field__label">직통번호</span><input class="input num" value="063-000-1111" inputmode="tel"></label></div></div>
    <div><p class="group-title">실무 담당자 <span class="auto">공고문</span> <span class="muted" style="font-weight:400">공고문에서 읽은 값입니다. 저장하면 확인한 값이 됩니다.</span></p><div class="form-grid">
      <label class="field"><span class="field__label">이름</span><input class="input" value="박○○"></label>
      <label class="field"><span class="field__label">직위</span><input class="input" value="주무관"></label>
      <label class="field"><span class="field__label">직통번호</span><input class="input num" value="063-000-000" aria-invalid="true" inputmode="tel"><span class="field__error">번호 자리수가 모자랍니다</span></label></div></div>
    <p class="muted" style="margin:0">연락처는 전북특별자치도교육청 시설과 공통입니다. 같은 부서가 실행부서인 사업에 모두 보입니다.</p>
  </div>
  <div class="form-actions"><button class="btn btn--quiet">취소</button><button class="btn">저장</button></div>
</section>
</main>
</body></html>
