<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notice · Nara 시안</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../nara.css"></head>
<body>
<div style="padding:16px;display:flex;flex-direction:column;gap:8px">
<div class="notice notice--success"><span class="notice__title">저장됨</span><span>바꾼 칸: 진행현황, 실행부서</span></div>
<div class="notice"><span class="notice__title">확인 필요</span><span>설치계획 확인이 필요한 사업이 3건 있습니다.</span><a href="#">설치계획 보기</a></div>
<div class="notice notice--warning"><span class="notice__title">일부만 표시</span><span>500건만 표시합니다. 조건을 좁혀 주세요.</span></div>
<div class="notice notice--danger"><span class="notice__title">저장 못 함</span><span>다른 사람이 먼저 고쳤습니다. 새로 불러온 뒤 다시 저장해 주세요.</span></div>
</div>
</body></html>
