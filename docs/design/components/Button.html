<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button · Nara 시안</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../nara.css"></head>
<body>
<div style="padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
  <button class="btn">조회</button><button class="btn btn--secondary">이 사업 다시 조회</button><button class="btn btn--quiet">조건 지우기</button><button class="btn" disabled>지금 실행</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
  <button class="btn btn--sm">선택한 사업 숨기기</button><button class="btn btn--sm btn--secondary">PDF로 출력</button><button class="btn btn--sm btn--secondary">엑셀로 받기</button><button class="btn btn--sm btn--quiet">선택 해제</button>
</div></div>
</body></html>
