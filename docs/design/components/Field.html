<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Field · Nara 시안</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../nara.css"></head>
<body>
<div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px">
  <label class="field"><span class="field__label">숨기는 이유(선택)</span><input class="input" placeholder="예: 도로 공사"><span class="field__help">목록과 PDF에서 빠집니다.</span></label>
  <label class="field"><span class="field__label">진행현황</span><select class="select"><option>착공 전(설계 단계)</option><option>시공 중</option></select></label>
  <label class="field"><span class="field__label">연면적(㎡)</span><input class="input input--num" value="12,480.5"></label>
  <label class="field"><span class="field__label">예산</span><input class="input input--num" value="12,000,000a" aria-invalid="true"><span class="field__error">숫자만 넣어 주세요</span></label>
</div>
</body></html>
